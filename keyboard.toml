# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "RMK-Numpad"
product_name = "Numpad"
vendor_id = 0x5959
product_id = 0x0003
manufacturer = "YinYang"
chip = "rp2040"

[host]
vial_enabled = false

[matrix]
matrix_type = "normal"
row_pins = ["PIN_6", "PIN_7", "PIN_8", "PIN_9", "PIN_10"]
col_pins = ["PIN_21", "PIN_20", "PIN_19", "PIN_18"]

# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 5
cols = 4
layers = 1
matrix_map = """
            (0,0) (0,1) (0,2) (0,3)
            (1,0) (1,1) (1,2) (1,3)
            (2,0) (2,1) (2,2)
            (3,0) (3,1) (3,2) (3,3)
            (4,0)       (4,2)
            """

[[layer]]
name = "base_layer"
keys = """
        NumLock KpSlash KpAsterisk KpMinus
        Kp7     Kp8     Kp9        KpPlus
        Kp4     Kp5     Kp6
        Kp1     Kp2     Kp3        KpEnter
        Kp0     KpDot
       """
